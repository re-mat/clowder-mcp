[project]
name = "clowder-mcp"
version = "0.1.0"
description = "Clowder MCP Server"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=2.14.4",
    "genson>=1.3.0",
    "pyclowder==2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clowder_mcp"]

[project.scripts]
clowder-mcp = "clowder_mcp.server:mcp.run"